<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fortune Farm Labs</title>
    <link rel="stylesheet" href="/static/launch/styles.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="title">
        <p class="eyebrow">Fortune Farm Labs</p>
        <h1 id="title">Farm operations, in one place.</h1>
        <p class="subtle">Enter the Fortune pilot password to continue.</p>
        <form id="login-form">
          <label for="password">Pilot password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <p id="status" role="status" aria-live="polite"></p>
          <button type="submit">Continue</button>
        </form>
        <p class="hindi" lang="hi">फॉर्च्यून फार्म लैब्स पायलट में प्रवेश करें</p>
      </section>
    </main>
    <script src="/static/launch/app.js"></script>
  </body>
</html>
