<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2e8d3">
    <title>AGRO CEO — Fortune Farms</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/assets/launch.css">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="title">
        <a class="wordmark" href="/" aria-label="Fortune Farms home"><img src="/assets/rice-sheaf-icon.png" alt=""> Fortune Farms</a>
        <p class="eyebrow">AGRO CEO <span aria-hidden="true">·</span> Private farm command</p>
        <h1 id="title">Come back to the field.</h1>
        <p class="subtle">Enter the Fortune pilot password to continue.</p>
        <form id="login-form">
          <label for="password">Pilot password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <p id="status" role="status" aria-live="polite"></p>
          <button type="submit">Open AGRO CEO <span aria-hidden="true">→</span></button>
        </form>
        <p class="hindi" lang="hi">फॉर्च्यून फार्म्स के निजी संचालन केंद्र में प्रवेश करें</p>
      </section>
    </main>
    <script src="/assets/launch.js"></script>
  </body>
</html>
